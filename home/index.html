<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Neon Snake</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            touch-action: none;
        }
        
        body {
            background: #0a0a0a;
            color: #fff;
            font-family: 'Courier New', monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }
        
        #gameContainer {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }
        
        #gameCanvas {
            border: 2px solid #00ff00;
            box-shadow: 0 0 20px rgba(0, 255, 0, 0.3);
            background: #111;
            max-width: 90vw;
            max-height: 60vh;
        }
        
        #ui {
            text-align: center;
            font-size: 24px;
            color: #00ff00;
            text-shadow: 0 0 10px rgba(0, 255, 0, 0.5);
        }
        
        #score {
            font-size: 20px;
            margin-top: 10px;
            color: #fff;
        }
        
        #highScore {
            font-size: 16px;
            color: #888;
            margin-top: 5px;
        }
        
        .screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: rgba(0, 0, 0, 0.9);
            z-index: 10;
            border: 2px solid #00ff00;
        }
        
        .hidden {
            display: none !important;
        }
        
        h1 {
            font-size: 48px;
            color: #00ff00;
            text-shadow: 0 0 20px rgba(0, 255, 0, 0.8);
            margin-bottom: 20px;
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }
        
        button {
            background: transparent;
            border: 2px solid #00ff00;
            color: #00ff00;
            padding: 15px 40px;
            font-size: 20px;
            font-family: inherit;
            cursor: pointer;
            transition: all 0.3s;
            text-transform: uppercase;
            margin-top: 20px;
        }
        
        button:hover {
            background: #00ff00;
            color: #000;
            box-shadow: 0 0 20px rgba(0, 255, 0, 0.6);
        }
        
        #mobileControls {
            display: none;
            grid-template-columns: repeat(3, 60px);
            grid-template-rows: repeat(2, 60px);
            gap: 10px;
            margin-top: 20px;
        }
        
        @media (max-width: 768px) {
            #mobileControls {
                display: grid;
            }
        }
        
        .control-btn {
            width: 60px;
            height: 60px;
            border: 2px solid #00ff00;
            background: rgba(0, 255, 0, 0.1);
            color: #00ff00;
            font-size: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            user-select: none;
            border-radius: 10px;
        }
        
        .control-btn:active {
            background: rgba(0, 255, 0, 0.4);
        }
        
        .control-btn:nth-child(2) { grid-column: 2; }
        .control-btn:nth-child(3) { grid-column: 1; grid-row: 2; }
        .control-btn:nth-child(4) { grid-column: 2; grid-row: 2; }
        .control-btn:nth-child(5) { grid-column: 3; grid-row: 2; }
        
        .game-over-text {
            color: #ff0000;
            font-size: 36px;
            text-shadow: 0 0 20px rgba(255, 0, 0, 0.8);
            margin-bottom: 10px;
        }
    </style>
</head>
<body>
    <div id="gameContainer">
        <div id="ui">
            <div>NEON SNAKE</div>
            <div id="score">Score: 0</div>
            <div id="highScore">High Score: 0</div>
        </div>
        
        <div style="position: relative;">
            <canvas id="gameCanvas" width="400" height="400"></canvas>
            
            <div id="startScreen" class="screen">
                <h1>SNAKE</h1>
                <p>Use arrow keys or buttons to move</p>
                <button onclick="startGame()">Start Game</button>
            </div>
            
            <div id="gameOverScreen" class="screen hidden">
                <div class="game-over-text">GAME OVER</div>
                <div id="finalScore" style="font-size: 24px; margin-bottom: 20px;">Score: 0</div>
                <button onclick="restartGame()">Play Again</button>
            </div>
        </div>
        
        <div id="mobileControls">
            <div class="control-btn" data-dir="up">▲</div>
            <div class="control-btn" data-dir="left">◀</div>
            <div class="control-btn" data-dir="down">▼</div>
            <div class="control-btn" data-dir="right">▶</div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const startScreen = document.getElementById('startScreen');
        const gameOverScreen = document.getElementById('gameOverScreen');
        const scoreElement = document.getElementById('score');
        const highScoreElement = document.getElementById('highScore');
        const finalScoreElement = document.getElementById('finalScore');
        
        let audioContext = null;
        
        function initAudio() {
            if (!audioContext) {
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
            }
        }
        
        function playSound(type) {
            if (!audioContext) return;
            
            const oscillator = audioContext.createOscillator();
            const gainNode = audioContext.createGain();
            
            oscillator.connect(gainNode);
            gainNode.connect(audioContext.destination);
            
            if (type === 'eat') {
                oscillator.frequency.value = 600;
                oscillator.type = 'square';
                gainNode.gain.setValueAtTime(0.1, audioContext.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.1);
                oscillator.start(audioContext.currentTime);
                oscillator.stop(audioContext.currentTime + 0.1);
            } else if (type === 'die') {
                oscillator.frequency.value = 150;
                oscillator.type = 'sawtooth';
                gainNode.gain.setValueAtTime(0.2, audioContext.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.3);
                oscillator.start(audioContext.currentTime);
                oscillator.stop(audioContext.currentTime + 0.3);
            } else if (type === 'move') {
                oscillator.frequency.value = 200;
                oscillator.type = 'sine';
                gainNode.gain.setValueAtTime(0.05, audioContext.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.05);
                oscillator.start(audioContext.currentTime);
                oscillator.stop(audioContext.currentTime + 0.05);
            }
        }
        
        const gridSize = 20;
        const tileCount = canvas.width / gridSize;
        
        let snake = [];
        let food = {};
        let direction = { x: 0, y: 0 };
        let nextDirection = { x: 0, y: 0 };
        let score = 0;
        let highScore = localStorage.getItem('snakeHighScore') || 0;
        let gameLoop = null;
        let gameSpeed = 100;
        let lastRenderTime = 0;
        let particles = [];
        
        highScoreElement.textContent = `High Score: ${highScore}`;
        
        function resizeCanvas() {
            const maxWidth = Math.min(window.innerWidth - 40, 400);
            const maxHeight = Math.min(window.innerHeight - 300, 400);
            const size = Math.min(maxWidth, maxHeight);
            
            canvas.style.width = size + 'px';
            canvas.style.height = size + 'px';
        }
        
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();
        
        function initGame() {
            snake = [
                { x: 10, y: 10 },
                { x: 10, y: 11 },
                { x: 10, y: 12 }
            ];
            direction = { x: 0, y: -1 };
            nextDirection = { x: 0, y: -1 };
            score = 0;
            gameSpeed = 100;
            particles = [];
            scoreElement.textContent = `Score: ${score}`;
            placeFood();
        }
        
        function placeFood() {
            food = {
                x: Math.floor(Math.random() * tileCount),
                y: Math.floor(Math.random() * tileCount)
            };
            
            for (let segment of snake) {
                if (segment.x === food.x && segment.y === food.y) {
                    placeFood();
                    return;
                }
            }
        }
        
        function update(currentTime) {
            gameLoop = requestAnimationFrame(update);
            
            const secondsSinceLastRender = (currentTime - lastRenderTime) / 1000;
            if (secondsSinceLastRender < gameSpeed / 1000) return;
            
            lastRenderTime = currentTime;
            
            direction = nextDirection;
            
            const head = { x: snake[0].x + direction.x, y: snake[0].y + direction.y };
            
            if (head.x < 0 || head.x >= tileCount || head.y < 0 || head.y >= tileCount) {
                gameOver();
                return;
            }
            
            for (let segment of snake) {
                if (head.x === segment.x && head.y === segment.y) {
                    gameOver();
                    return;
                }
            }
            
            snake.unshift(head);
            
            if (head.x === food.x && head.y === food.y) {
                score += 10;
                scoreElement.textContent = `Score: ${score}`;
                playSound('eat');
                createParticles(food.x * gridSize + gridSize/2, food.y * gridSize + gridSize/2);
                
                if (gameSpeed > 50) {
                    gameSpeed -= 2;
                }
                
                placeFood();
            } else {
                snake.pop();
            }
            
            playSound('move');
            draw();
        }
        
        function draw() {
            ctx.fillStyle = '#111';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            ctx.strokeStyle = '#222';
            ctx.lineWidth = 0.5;
            for (let i = 0; i < tileCount; i++) {
                ctx.beginPath();
                ctx.moveTo(i * gridSize, 0);
                ctx.lineTo(i * gridSize, canvas.height);
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(0, i * gridSize);
                ctx.lineTo(canvas.width, i * gridSize);
                ctx.stroke();
            }
            
            ctx.shadowBlur = 20;
            ctx.shadowColor = '#ff0000';
            ctx.fillStyle = '#ff0000';
            ctx.fillRect(food.x * gridSize + 2, food.y * gridSize + 2, gridSize - 4, gridSize - 4);
            
            ctx.shadowBlur = 15;
            ctx.shadowColor = '#00ff00';
            
            snake.forEach((segment, index) => {
                if (index === 0) {
                    ctx.fillStyle = '#00ff00';
                    ctx.fillRect(segment.x * gridSize + 1, segment.y * gridSize + 1, gridSize - 2, gridSize - 2);
                    
                    ctx.fillStyle = '#000';
                    ctx.shadowBlur = 0;
                    const eyeSize = 3;
                    
                    if (direction.x === 1) {
                        ctx.fillRect(segment.x * gridSize + 12, segment.y * gridSize + 5, eyeSize, eyeSize);
                        ctx.fillRect(segment.x * gridSize + 12, segment.y * gridSize + 12, eyeSize, eyeSize);
                    } else if (direction.x === -1) {
                        ctx.fillRect(segment.x * gridSize + 5, segment.y * gridSize + 5, eyeSize, eyeSize);
                        ctx.fillRect(segment.x * gridSize + 5, segment.y * gridSize + 12, eyeSize, eyeSize);
                    } else if (direction.y === -1) {
                        ctx.fillRect(segment.x * gridSize + 5, segment.y * gridSize + 5, eyeSize, eyeSize);
                        ctx.fillRect(segment.x * gridSize + 12, segment.y * gridSize + 5, eyeSize, eyeSize);
                    } else {
                        ctx.fillRect(segment.x * gridSize + 5, segment.y * gridSize + 12, eyeSize, eyeSize);
                        ctx.fillRect(segment.x * gridSize + 12, segment.y * gridSize + 12, eyeSize, eyeSize);
                    }
                } else {
                    ctx.fillStyle = `rgba(0, 255, 0, ${1 - index / (snake.length + 5)})`;
                    ctx.shadowBlur = 10;
                    ctx.shadowColor = '#00ff00';
                    ctx.fillRect(segment.x * gridSize + 2, segment.y * gridSize + 2, gridSize - 4, gridSize - 4);
                }
            });
            
            ctx.shadowBlur = 0;
            updateParticles();
        }
        
        function createParticles(x, y) {
            for (let i = 0; i < 8; i++) {
                particles.push({
                    x: x,
                    y: y,
                    vx: (Math.random() - 0.5) * 4,
                    vy: (Math.random() - 0.5) * 4,
                    life: 1.0,
                    color: `hsl(${Math.random() * 60 + 120}, 100%, 50%)`
                });
            }
        }
        
        function updateParticles() {
            for (let i = particles.length - 1; i >= 0; i--) {
                let p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.life -= 0.05;
                
                if (p.life <= 0) {
                    particles.splice(i, 1);
                } else {
                    ctx.globalAlpha = p.life;
                    ctx.fillStyle = p.color;
                    ctx.fillRect(p.x - 2, p.y - 2, 4, 4);
                    ctx.globalAlpha = 1;
                }
            }
        }
        
        function gameOver() {
            cancelAnimationFrame(gameLoop);
            playSound('die');
            
            if (score > highScore) {
                highScore = score;
                localStorage.setItem('snakeHighScore', highScore);
                highScoreElement.textContent = `High Score: ${highScore}`;
            }
            
            finalScoreElement.textContent = `Score: ${score}`;
            gameOverScreen.classList.remove('hidden');
        }
        
        function startGame() {
            initAudio();
            startScreen.classList.add('hidden');
            initGame();
            lastRenderTime = performance.now();
            gameLoop = requestAnimationFrame(update);
        }
        
        function restartGame() {
            gameOverScreen.classList.add('hidden');
            initGame();
            lastRenderTime = performance.now();
            gameLoop = requestAnimationFrame(update);
        }
        
        document.addEventListener('keydown', (e) => {
            if (startScreen.classList.contains('hidden') === false) return;
            
            switch(e.key) {
                case 'ArrowUp':
                case 'w':
                case 'W':
                    if (direction.y === 0) nextDirection = { x: 0, y: -1 };
                    break;
                case 'ArrowDown':
                case 's':
                case 'S':
                    if (direction.y === 0) nextDirection = { x: 0, y: 1 };
                    break;
                case 'ArrowLeft':
                case 'a':
                case 'A':
                    if (direction.x === 0) nextDirection = { x: -1, y: 0 };
                    break;
                case 'ArrowRight':
                case 'd':
                case 'D':
                    if (direction.x === 0) nextDirection = { x: 1, y: 0 };
                    break;
            }
        });
        
        document.querySelectorAll('.control-btn').forEach(btn => {
            btn.addEventListener('touchstart', (e) => {
                e.preventDefault();
                const dir = btn.getAttribute('data-dir');
                
                if (dir === 'up' && direction.y === 0) nextDirection = { x: 0, y: -1 };
                if (dir === 'down' && direction.y === 0) nextDirection = { x: 0, y: 1 };
                if (dir === 'left' && direction.x === 0) nextDirection = { x: -1, y: 0 };
                if (dir === 'right' && direction.x === 0) nextDirection = { x: 1, y: 0 };
            });
            
            btn.addEventListener('mousedown', (e) => {
                const dir = btn.getAttribute('data-dir');
                
                if (dir === 'up' && direction.y === 0) nextDirection = { x: 0, y: -1 };
                if (dir === 'down' && direction.y === 0) nextDirection = { x: 0, y: 1 };
                if (dir === 'left' && direction.x === 0) nextDirection = { x: -1, y: 0 };
                if (dir === 'right' && direction.x === 0) nextDirection = { x: 1, y: 0 };
            });
        });
        
        document.addEventListener('touchmove', function(e) {
            if (e.target.closest('#gameCanvas') || e.target.closest('.control-btn')) {
                e.preventDefault();
            }
        }, { passive: false });
    </script>
</body>
</html>
